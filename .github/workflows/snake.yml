name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0b0b0c&color_dots=#ebedf0,#c7d7fa,#8fb0f4,#5585ee,#2261e9
            dist/snake-dark.svg?palette=github-dark&color_snake=#fbfbf8&color_dots=#161b22,#0f2a66,#1a46a8,#2261e9,#6f9bf5

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
